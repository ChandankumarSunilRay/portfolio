<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chandankumar Ray | Resume</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #eef0f3; color: #18202b; font: 16px/1.5 system-ui, sans-serif; }
      header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; background: white; border-bottom: 1px solid #d8dde5; }
      h1 { margin: 0; font-size: 20px; }
      nav { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
      a { color: #47329b; }
      .button, button { display: inline-block; border: 1px solid #c9ced7; border-radius: 6px; padding: 9px 16px; background: white; color: #18202b; text-decoration: none; font: inherit; cursor: pointer; }
      button { background: #18202b; color: white; border-color: #18202b; }
      :focus-visible { outline: 3px solid #7959d7; outline-offset: 3px; }
      .hint { margin: 12px 24px; font-size: 14px; }
      iframe { display: block; width: 100%; height: 82vh; min-height: 500px; border: 0; background: white; }
      @media (max-width: 600px) { header { padding: 16px; } .hint { margin: 12px 16px; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Chandankumar Ray — Resume</h1>
      <nav aria-label="Resume actions">
        <a href="/">Portfolio</a>
        <a class="button" href="/Chandankumar-Ray-Resume.pdf" download>Download PDF</a>
        <button id="print" type="button">Print resume</button>
      </nav>
    </header>
    <p class="hint" id="help" role="status">This is the original PDF. If the preview or print dialog does not open, <a href="/Chandankumar-Ray-Resume.pdf" target="_blank" rel="noopener">open the PDF directly</a> and use your browser’s Print option.</p>
    <main>
      <iframe id="resume" src="/Chandankumar-Ray-Resume.pdf" title="Chandankumar Ray resume PDF"></iframe>
    </main>
    <script>
      const frame = document.getElementById('resume');
      document.getElementById('print').addEventListener('click', () => {
        try {
          frame.contentWindow.focus();
          frame.contentWindow.print();
        } catch {
          window.open('/Chandankumar-Ray-Resume.pdf', '_blank', 'noopener');
        }
      });
    </script>
  </body>
</html>
